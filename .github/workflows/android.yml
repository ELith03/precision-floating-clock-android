name: Build Android APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - name: Install SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Test, lint and build
        run: bash ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
      - name: Verify installable APK exists
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/PrecisionClock-1.0.0-debug.apk
          sha256sum dist/PrecisionClock-1.0.0-debug.apk > dist/SHA256SUMS.txt
      - name: Upload APK
        id: apk
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: PrecisionClock-debug-APK
          path: dist/
          if-no-files-found: error
          retention-days: 30
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: test-and-lint-reports
          path: |
            app/build/reports/
            app/build/test-results/
            app/build/widget-previews/
          if-no-files-found: warn
      - name: Build summary
        if: always()
        env:
          STATUS: ${{ job.status }}
          APK_URL: ${{ steps.apk.outputs.artifact-url }}
        run: |
          printf '## Precision Clock\nBuild: %s\n\n' "$STATUS" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$APK_URL" ]; then printf '[Download APK artifact](%s)\n' "$APK_URL" >> "$GITHUB_STEP_SUMMARY"; fi
